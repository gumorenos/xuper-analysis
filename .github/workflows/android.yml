name: android

on:
  push:
    paths: ["unified-tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        run: |
          sdkmanager --list-installed | head -3 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Setup Gradle 8.7
        run: |
          curl -sfLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build debug APK
        working-directory: unified-tv
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon
      - name: Commit APK al repo
        working-directory: unified-tv
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../uniplay-debug.apk
          cd ..
          git config user.name "CI Builder"
          git config user.email "ci@noreply"
          git add uniplay-debug.apk
          git commit -m "UniPlay APK [skip ci]" || echo "sin cambios"
          git push
