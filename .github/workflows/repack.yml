name: repack

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: "Nombre del APK en el repo (raíz) a repackear"
        default: "wiwyxuper.apk"

permissions:
  contents: write
jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup tools
        run: |
          set -e
          curl -sfLo /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          # aapt2 nativo desde Maven de Google (JAR con el binario dentro)
          curl -sfLo /tmp/aapt2.jar https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/8.4.1-11315950/aapt2-8.4.1-11315950-linux.jar
          mkdir -p /tmp/aapt2x && cd /tmp/aapt2x && unzip -o -q /tmp/aapt2.jar
          cp /tmp/aapt2x/aapt2 /usr/local/bin/aapt2 && chmod +x /usr/local/bin/aapt2
          /usr/local/bin/aapt2 version | head -1 || true
          echo "APKTOOL=/usr/local/bin/apktool.jar" >> $GITHUB_ENV
          echo "AAPT2=/usr/local/bin/aapt2" >> $GITHUB_ENV
      - name: Repack
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -e
          chmod +x scripts/repack.sh
          bash scripts/repack.sh "$APK_NAME" "repacked-${APK_NAME%.apk}-debug.apk"
      - name: Commit APK al repo
        run: |
          git config user.name "CI Builder"
          git config user.email "ci@noreply"
          git add repacked-*.apk
          git commit -m "APK reempaquetado: ${{ inputs.apk_name }} [skip ci]" || echo "sin cambios"
          git push
